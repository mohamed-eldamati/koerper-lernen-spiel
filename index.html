<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Der Körper – Lernen und Spielen</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2742;--bg:#eef3ff;--blue:#2f6bff;--yel:#ffb400;--ok:#17a36b;--no:#e5484d;--mut:#5d6a8a;--der:#2f6bff;--die:#e5484d;--das:#17a36b}
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:1.3rem;margin:0;font-weight:600;cursor:pointer}
.snd{display:flex;gap:8px}
.ib{border:2px solid #ffffff44;background:#ffffff14;color:#fff;border-radius:14px;padding:6px 12px;font:inherit;font-size:.95rem;cursor:pointer}
.ib.off{opacity:.55}.ib.off span{text-decoration:line-through}
button:focus-visible,.p:focus-visible,.lab:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:22px 16px 50px}
h2{font-size:2rem;margin:.2em 0 .3em;font-weight:700}
h3{font-size:1.3rem;margin:26px 0 10px}
.lead{color:var(--mut);font-size:1.1rem;margin:0 0 14px}
.seg{display:inline-flex;background:#fff;border-radius:16px;padding:4px;gap:4px;box-shadow:0 2px 0 #cfd9f5}
.seg button{border:0;background:none;font:inherit;padding:8px 16px;border-radius:12px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gc{background:#fff;border:0;border-radius:22px;padding:20px;text-align:left;font:inherit;cursor:pointer;box-shadow:0 5px 0 #cfd9f5;transition:transform .12s}
.gc:hover{transform:translateY(-3px)}.gc.big{background:var(--blue);color:#fff;box-shadow:0 5px 0 #1f4bb8}.gc.big small{color:#dfe8ff}
.gc b{display:block;font-size:1.3rem;margin:6px 0 4px}.gc i{font-style:normal;font-size:2.2rem}.gc small{color:var(--mut);font-size:1rem}
.score{display:flex;gap:12px;margin-bottom:16px}
.team{flex:1;border-radius:18px;padding:10px 16px;background:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:600;border:3px solid transparent;font-size:1.15rem}
.team.t0{--c:var(--blue)}.team.t1{--c:var(--yel)}
.team.act{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.team em{font-style:normal;font-size:1.6rem;color:var(--c)}
.q{background:#fff;border-radius:24px;padding:20px;box-shadow:0 5px 0 #cfd9f5}
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qt{font-size:1.7rem;font-weight:600;margin:0}.qn{color:var(--mut)}
.rep{border:0;background:#dbe6ff;border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
.stage{display:flex;justify-content:center;margin-top:8px}
svg{width:100%;height:auto;max-height:78vh}
.p{fill:var(--f,#e8b98f);stroke:var(--ink);stroke-width:3;cursor:pointer;transition:filter .15s}
.p:hover{filter:brightness(1.1)}
.p.sel{stroke:var(--blue);stroke-width:7}
.p.ok{fill:var(--ok)}.p.no{fill:var(--no)}
.n{stroke:var(--ink);stroke-width:3;pointer-events:none}
.hs{fill:rgba(47,107,255,.14);stroke:var(--blue);stroke-width:3;stroke-dasharray:6 5;cursor:pointer}.hs:hover{fill:rgba(47,107,255,.3)}
.hs.sel{fill:rgba(255,180,0,.45);stroke:var(--yel);stroke-width:5;stroke-dasharray:none}.hs.ok{fill:rgba(23,163,107,.55);stroke:var(--ok);stroke-dasharray:none}.hs.no{fill:rgba(229,72,77,.5);stroke:var(--no);stroke-dasharray:none}
.ld{stroke:#1b2742;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}.hsf{fill:none!important;stroke-width:6}.lab .pl{fill:#5d6a8a;font-weight:500}.lab.ok rect{fill:#c9f2de}.lab.no rect{fill:#fbd0d2}
.lab{cursor:pointer}.lab rect{fill:#fff;stroke-width:4;transition:fill .15s}.lab text{font-family:Fredoka,sans-serif;font-weight:600;fill:var(--ink);pointer-events:none}
.lab line{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:2 6;stroke-linecap:round}.lab circle{fill:var(--ink)}
.lab:hover rect,.lab.sel rect{fill:#fff3c4}.lab.sel rect{stroke-width:7}
.cap{text-align:center;font-size:2.6rem;font-weight:700;min-height:1.4em;margin:6px 0}
.cap.der{color:var(--der)}.cap.die{color:var(--die)}.cap.das{color:var(--das)}.cap.hint{font-size:1.2rem;font-weight:400;color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.opt{border:3px solid #cfd9f5;background:#fff;border-radius:18px;padding:16px;font:inherit;font-size:1.4rem;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--blue)}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.msg{min-height:2.2em;text-align:center;font-size:1.3rem;font-weight:600;margin-top:12px}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.btn{border:0;background:var(--blue);color:#fff;font:inherit;font-size:1.15rem;padding:12px 24px;border-radius:16px;cursor:pointer;box-shadow:0 4px 0 #1f4bb8;margin:6px}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 #cfd9f5}
.bar{text-align:center;margin-top:10px}
.res{text-align:center;padding:30px 10px}.res .big{font-size:4rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1 id="home">Der Körper</h1>
<div class="snd">
<button class="ib" id="bv" aria-pressed="true" title="Aussprache an/aus">🗣️ <span>Aussprache</span></button>
<button class="ib" id="bf" aria-pressed="true" title="Effekte an/aus">🔔 <span>Effekte</span></button>
</div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const S={voice:true,fx:true,n:2,teams:[{s:0},{s:0}],turn:0,qs:[],i:0,game:'',lock:false,tm:[]};
const D={kopf:['der','Kopf','Köpfe'],hals:['der','Hals','Hälse'],ruecken:['der','Rücken','Rücken'],fuss:['der','Fuß','Füße'],bauch:['der','Bauch','Bäuche'],arm:['der','Arm','Arme'],hand:['die','Hand','Hände'],finger:['der','Finger','Finger'],bein:['das','Bein','Beine'],knie:['das','Knie','Knie'],
haar:['das','Haar','Haare'],auge:['das','Auge','Augen'],nase:['die','Nase','Nasen'],ohr:['das','Ohr','Ohren'],mund:['der','Mund','Münder'],zahn:['der','Zahn','Zähne'],gesicht:['das','Gesicht','Gesichter']};
const BODY=['kopf','hals','arm','hand','finger','bauch','bein','knie','fuss','ruecken'],FACE=['haar','auge','nase','ohr','mund','zahn','gesicht'];
const SENSE=[['schmecken','mund'],['riechen','nase'],['hören','ohr'],['sehen','auge']];
const name=id=>D[id][0]+' '+D[id][1],plu=id=>'die '+D[id][2];
const sh=a=>[...a].sort(()=>Math.random()-.5);

/* Sound */
let AC;function tone(f,t,d,ty='sine',v=.18){AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+t;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}
function fx(k){if(!S.fx)return;try{if(k=='ok'){tone(660,0,.14);tone(880,.12,.22)}else if(k=='no'){tone(200,0,.3,'sawtooth',.12);tone(150,.15,.3,'sawtooth',.12)}else if(k=='win')[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.14,.25,'triangle'));else tone(520,0,.07,'triangle',.08)}catch(e){}}
let voices=[];const lv=()=>voices=speechSynthesis.getVoices();if('speechSynthesis'in window){lv();speechSynthesis.onvoiceschanged=lv}
function say(t){if(!S.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.75;const v=voices.find(v=>v.lang&&v.lang.replace('_','-').startsWith('de'));if(v)u.voice=v;speechSynthesis.speak(u)}
function tg(id,k){const b=$(id);b.onclick=()=>{S[k]=!S[k];b.classList.toggle('off',!S[k]);b.setAttribute('aria-pressed',S[k]);if(!S[k]&&k=='voice')speechSynthesis.cancel();if(S[k])k=='fx'?fx('ok'):say('Aussprache an')}}
tg('#bv','voice');tg('#bf','fx');$('#home').onclick=menu;
const stopAll=()=>{S.tm.forEach(clearTimeout);S.tm=[];'speechSynthesis'in window&&speechSynthesis.cancel()};

${L(l,6,'ruecken',833,244,189,71,1078,279,f)}${L(l,7,'finger',768,396,189,91,1052,430,f)}${L(l,8,'kopf',1264,49,214,71,1152,73,f)}${L(l,9,'knie',1349,333,173,90,1260,378,f)}${L(l,10,'fuss',1354,580,168,92,1266,586,f)}</svg>`}
function faceSVG(l){const f=32;return `<svg viewBox="0 0 1100 745" role="img" aria-label="Das Gesicht"><image href="${IMG.face}" x="298" y="100" width="504" height="627"/>
<rect class="hs hsf" data-id="gesicht" tabindex="0" x="292" y="94" width="516" height="639" rx="16" pointer-events="stroke"/>
${L(l,7,'gesicht',425,10,250,76,null,null,f)}
${L(l,1,'haar',10,150,250,76,353,243,f,'L')}${L(l,2,'auge',10,320,250,76,485,395,f,'L')}${L(l,3,'mund',10,560,250,76,501,509,f,'L')}
${L(l,4,'nase',840,237,250,76,556,441,f,'R')}${L(l,5,'ohr',840,377,250,76,681,457,f,'R')}${L(l,6,'zahn',840,527,250,76,562,523,f,'R')}</svg>`}

/* Menu */
function menu(){stopAll();const C=(g,i,t,s,b)=>`<button class="gc ${b?'big':''}" data-g="${g}"><i>${i}</i><b>${t}</b><small>${s}</small></button>`;
app.innerHTML=`<h2>Hallo! Wir lernen den Körper.</h2><p class="lead">Zuerst lernen, dann spielen. Lass dir Zeit.</p>
<h3>1. Lernen</h3><div class="grid">${C('Lbody','🧍','Der Körper','Tippe auf ein Wort und höre es.',1)}${C('Lface','🙂','Das Gesicht','Tippe auf ein Wort und höre es.',1)}</div>
<h3>2. Spielen</h3><div class="seg" role="group" aria-label="Spielmodus"><button id="m1" class="${S.n==1?'on':''}">Allein</button><button id="m2" class="${S.n==2?'on':''}">Zwei Teams</button></div><p class="lead" style="margin-top:10px">Bei zwei Teams sind die Teams abwechselnd dran.</p>
<div class="grid">${C('body','🎯','Zeig den Körper','Hör das Wort und tippe auf den Körperteil.')}${C('face','👀','Zeig das Gesicht','Wo ist was im Gesicht?')}${C('sense','👃','Die Sinne','schmecken, riechen, hören, sehen')}${C('art','📝','der, die oder das?','Wähle den Artikel.')}${C('plural','✌️','Der Plural','Ein Arm, zwei …?')}</div>`;
$('#m1').onclick=()=>{S.n=1;menu()};$('#m2').onclick=()=>{S.n=2;menu()};
app.querySelectorAll('.gc').forEach(b=>b.onclick=()=>b.dataset.g[0]=='L'&&b.dataset.g.length>3?learn(b.dataset.g=='Lbody'?'body':'face'):start(b.dataset.g))}

/* Lernen */
function sel(id,speak=true){app.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));app.querySelectorAll(`[data-id="${id}"]`).forEach(e=>e.classList.add('sel'));
const c=$('#cap');c.className='cap '+D[id][0];c.textContent=name(id)+'  ·  '+plu(id);if(speak){fx('x');say(name(id)+', '+plu(id))}}
function learn(w){stopAll();const ids=w=='body'?BODY:FACE;
app.innerHTML=`<h2>${w=='body'?'Der Körper':'Das Gesicht'}</h2><p class="lead">Tippe auf ein Wort oder auf den Körperteil. Du hörst das Wort.</p>
<div class="q"><div class="stage">${(w=='body'?bodySVG:faceSVG)(true)}</div><div class="cap hint" id="cap">Tippe auf ein Wort.</div></div>
<div class="bar"><button class="btn" id="all">▶ Alle Wörter anhören</button><button class="btn" id="pl">${w=='body'?'Jetzt spielen':'Jetzt spielen'}</button><button class="btn alt" id="bk">Menü</button></div>`;
app.querySelectorAll('.hs,.lab').forEach(e=>{const go=()=>{stopAll();sel(e.dataset.id)};e.onclick=go;e.onkeydown=ev=>{if(ev.key=='Enter'||ev.key==' '){ev.preventDefault();go()}}});
$('#all').onclick=()=>{stopAll();ids.forEach((id,i)=>S.tm.push(setTimeout(()=>sel(id),i*3800)))};
$('#pl').onclick=()=>start(w);$('#bk').onclick=menu}

/* Spielen */
function build(g){const all=[...BODY,...FACE];
if(g=='body')return sh(BODY).map(id=>({t:'pt',id,svg:bodySVG,p:`Wo ist ${name(id)}?`,sp:`Wo ist ${name(id)}?`}));
if(g=='face')return sh(FACE).map(id=>({t:'pt',id,svg:faceSVG,p:`Wo ist ${name(id)}?`,sp:`Wo ist ${name(id)}?`}));
if(g=='sense')return sh(SENSE).map(s=>({t:'ch',p:`${s[0]}: Welches Wort passt?`,sp:s[0],ans:name(s[1]),say:`${s[0]}: ${name(s[1])}`,o:sh(SENSE.map(x=>name(x[1])))}));
if(g=='art')return sh(all).slice(0,10).map(id=>({t:'ch',p:`Welcher Artikel? ___ ${D[id][1]}`,sp:D[id][1],ans:D[id][0],say:name(id),o:['der','die','das']}));
if(g=='plural')return sh(all).slice(0,10).map(id=>({t:'ch',p:`${name(id)} → Plural?`,sp:name(id),ans:plu(id),say:`${name(id)}, ${plu(id)}`,o:sh([plu(id),...[...new Set(sh(all).map(plu).filter(x=>x!=plu(id)))].slice(0,3)])}))}
function start(g){stopAll();S.game=g;S.qs=build(g);S.i=0;S.turn=0;S.teams=[{s:0},{s:0}];show()}
function board(){const nm=['Team Blau','Team Gelb'];return `<div class="score">${S.teams.slice(0,S.n).map((t,i)=>`<div class="team t${i} ${S.n>1&&S.turn==i?'act':''}"><span>${S.n>1?nm[i]:'Punkte'}</span><em>${t.s}</em></div>`).join('')}</div>`}
function show(){stopAll();S.lock=false;const q=S.qs[S.i];
app.innerHTML=`${board()}<div class="q"><div class="qh"><p class="qt">${q.p}</p><div><span class="qn">${S.i+1} / ${S.qs.length}</span> <button class="rep" id="rep">🔁 Nochmal hören</button></div></div>
${q.t=='pt'?`<div class="stage">${q.svg(false)}</div>`:`<div class="opts">${q.o.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`}
<div class="msg" id="msg" aria-live="polite">${S.n>1?['Team Blau','Team Gelb'][S.turn]+' ist dran.':''}</div></div>
<p class="bar"><button class="btn alt" id="bk">Menü</button></p>`;
$('#bk').onclick=menu;$('#rep').onclick=()=>say(q.sp);setTimeout(()=>say(q.sp),300);
if(q.t=='pt')app.querySelectorAll('.hs,.lab').forEach(e=>{const go=()=>answer(e.dataset.id==q.id,e);e.onclick=go;e.onkeydown=ev=>{if(ev.key=='Enter'||ev.key==' '){ev.preventDefault();go()}}});
else app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.v==q.ans,b))}
function answer(ok,el){if(S.lock)return;S.lock=true;const q=S.qs[S.i],m=$('#msg');
el.classList.add(ok?'ok':'no');
if(q.t=='pt')app.querySelectorAll(`.hs[data-id="${q.id}"],.lab[data-id="${q.id}"]`).forEach(e=>e.classList.add('ok'));else app.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v==q.ans)b.classList.add('ok')});
fx(ok?'ok':'no');if(ok)S.teams[S.turn].s+=10;
m.className='msg '+(ok?'ok':'no');
m.innerHTML=(ok?'Richtig! +10 Punkte':'Nicht ganz. Richtig ist: '+(q.t=='pt'?name(q.id):q.ans))+'<br><button class="btn" id="nx">Weiter</button>';
S.tm.push(setTimeout(()=>say(q.t=='pt'?name(q.id):q.say),500));
$('#nx').focus();$('#nx').onclick=()=>{S.i++;S.turn=(S.turn+1)%S.n;S.i>=S.qs.length?finish():show()}}
function finish(){stopAll();const [a,b]=[S.teams[0].s,S.teams[1].s];let r;
if(S.n==1)r=`${a} von ${S.qs.length*10} Punkten!`;else r=a==b?'Unentschieden! Beide Teams sind super.':(a>b?'Team Blau':'Team Gelb')+' gewinnt!';
app.innerHTML=`<div class="res"><div class="big">🏆</div><h2>Gut gemacht!</h2><p class="lead">${r}</p>${board()}<button class="btn" id="ag">Nochmal spielen</button><button class="btn alt" id="mn">Menü</button></div>`;
$('#ag').onclick=()=>start(S.game);$('#mn').onclick=menu;fx('win');S.tm.push(setTimeout(()=>say('Gut gemacht!'),900))}
menu();
</script></body></html>
